    <div class="window" id="win-flappy" data-app="flappy" style="display:none; top:110px; left:220px; width:450px; height:600px;">

        <div class="win-controls">
          <button class="win-btn win-close" data-win="flappy" title="Close"></button>

          <button class="win-btn win-maximize" data-win="flappy" title="Maximize"></button>
