    <!-- KATOU AI CHATBOT WINDOW -->
    <div class="window" id="win-chatbot" data-app="chatbot" style="display:none; top:60px; left:150px; width:860px; height:610px;">
      <div class="win-titlebar">
        <div class="win-controls">
          <button class="win-btn win-close" data-win="chatbot" title="Close"></button>
          <button class="win-btn win-minimize" data-win="chatbot" title="Minimize"></button>
          <button class="win-btn win-maximize" data-win="chatbot" title="Maximize"></button>
        </div>
        <span class="win-title"><i class="fas fa-wand-magic-sparkles"></i> &nbsp;Katou AI</span>
        <div class="win-title-spacer"></div>
      </div>
      <div class="win-body chatbot-win-body kc">
        <!-- Icon rail -->
        <nav class="kc-rail" aria-label="Aksi chat">
          <button type="button" class="kc-rail-btn kc-active" id="chat-clear-btn" title="Percakapan baru"><i class="fas fa-wand-magic-sparkles"></i></button>
          <button type="button" class="kc-rail-btn vv-view" title="Perbesar karakter"><i class="fas fa-expand"></i></button>
          <button type="button" class="kc-rail-btn vv-fold" title="Sembunyikan karakter"><i class="fas fa-eye-slash"></i></button>
        </nav>

        <div class="win-content chatbot-content kc-main kc-hero">
          <div class="kc-topbar">
            <span class="kc-pill kc-credit"><i class="fas fa-microphone-lines"></i> Suara: VOICEVOX:WhiteCUL</span>
          </div>

          <div class="chatbot-stage-wrap">
            <!-- Empty-state headline -->
            <div class="kc-hero-copy">
              <h1><span class="kc-fade">Tanya apa saja ke</span><br>Katou AI</h1>
            </div>
            <!-- Conversation -->
            <div class="chatbot-messages" id="chatbot-messages"></div>
          </div>

          <!-- Character: stands on the right and overlaps the chat -->
          <div class="vv-stage" id="vv-stage" data-state="idle" data-emo="normal">
            <div class="vv-avatar" title="Klik untuk menyapa"></div>
            <div class="vv-info">
              <div class="vv-name">Katou</div>
              <div class="vv-sub" lang="ja">こんにちは！</div>
              <div class="vv-status">Klik aku untuk menyapa</div>
            </div>
          </div>

          <div class="kc-bottom">
            <div class="kc-chips" role="group" aria-label="Topik cepat">
              <button type="button" class="kc-chip" onclick="sendQuickPrompt('Ceritakan tentang Firman Ardiansyah dan keahliannya')"><i class="fas fa-user"></i> Tentang Firman</button>
              <button type="button" class="kc-chip" onclick="sendQuickPrompt('Apa saja proyek unggulan yang pernah dibuat Firman?')"><i class="fas fa-laptop-code"></i> Proyek</button>
              <button type="button" class="kc-chip" onclick="sendQuickPrompt('Sebutkan tech stack dan bahasa pemrograman yang dikuasai')"><i class="fas fa-layer-group"></i> Tech Stack</button>
              <button type="button" class="kc-chip" onclick="sendQuickPrompt('Bagaimana cara menghubungi Firman untuk kerja sama/proyek?')"><i class="fas fa-paper-plane"></i> Kontak</button>
            </div>

            <div class="chatbot-input-container kc-compose">
              <form id="chatbot-form" class="chatbot-input-form" onsubmit="handleChatSubmit(event)">
                <div class="chat-input-wrapper kc-input-card">
                  <textarea
                    id="chatbot-input"
                    class="chatbot-input"
                    placeholder="Tanya Katou AI..."
                    rows="1"
                    required
                  ></textarea>
                  <div class="kc-input-row">
                    <button type="button" class="kc-pill kc-pill-btn vv-mute" title="Matikan suara"><i class="fas fa-volume-high"></i> Suara</button>
                    <button type="submit" class="chat-send-btn" id="chat-send-btn" title="Kirim pesan"><i class="fas fa-paper-plane"></i> Kirim</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
