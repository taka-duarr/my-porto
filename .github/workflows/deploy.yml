name: Deploy to Server via Tailscale

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy via Tailscale
    runs-on: ubuntu-latest

    steps:
      # 1. Hubungkan GitHub Runner ke Tailnet Anda
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # 2. Eksekusi SSH langsung ke IP / Hostname Tailscale Server
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }} # Gunakan IP Tailscale (misal 100.x.y.z atau hostname Tailscale)
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "🚀 [CI/CD] Starting Deployment via Tailscale..."
            cd ${{ secrets.DEPLOY_PATH }}
            git config --global --add safe.directory "${{ secrets.DEPLOY_PATH }}"
            git config --global --add safe.directory "$PWD"
            git pull origin main
            echo "✅ [CI/CD] Deployed successfully to server!"
